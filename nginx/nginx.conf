events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Backend Gunicorn server upstream
    upstream backend_app {
        server backend:8000;
    }

    # Frontend Next.js app upstream
    upstream frontend_app {
        server frontend:3000;
    }

        server {
        listen 80;
        server_name sessions.safaldev.me;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name sessions.safaldev.me;

        ssl_certificate /etc/letsencrypt/live/sessions.safaldev.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sessions.safaldev.me/privkey.pem;

        # Expose Django static assets collected in shared volume
        location /django_static/ {
            alias /app/backend/staticfiles/;
        }

        # Route Next.js Auth callback directly to Frontend
        location ^~ /auth/callback {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route DRF APIs, Admin panel, and socialauth callbacks directly to Django
        location ~ ^/(api|admin|auth|complete)/ {
            proxy_pass http://backend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Route Next.js Frontend App
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

        
}

